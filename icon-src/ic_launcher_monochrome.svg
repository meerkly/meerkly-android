<?xml version="1.0" encoding="UTF-8"?>
<!--
  Adaptive icon monochrome layer (Android 13+ themed icons). The OS supplies
  the tint and ignores colour, so only alpha coverage carries the design:
  everything is one opaque fill, and the features that would otherwise merge
  into a blob (the $ glyph, the coin rim, the head/coin seam, the ears) are
  punched back OUT via a mask. Keep in sync with ic_launcher_foreground.svg.
-->
<svg width="108" height="108" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="cuts">
      <!-- white = keep, black = cut away -->
      <rect width="108" height="108" fill="#ffffff"/>
      <g transform="translate(6.58,5.07) scale(0.0888)">
        <!-- seam between the head and the coin so they read as two shapes -->
        <circle cx="512" cy="700" r="203" fill="none" stroke="#000000" stroke-width="26"/>
        <!-- coin rim -->
        <circle cx="512" cy="700" r="139" fill="none" stroke="#000000" stroke-width="16"/>
        <!-- the $ glyph -->
        <g transform="translate(512,700) scale(7.9) translate(-24,-24)">
          <path d="M24 12.5v23M28.8 17c-1.1-1.4-2.9-2.1-4.8-2.1-2.6 0-4.4 1.4-4.4 3.5 0 4.8 9.4 2.5 9.4 7.3 0 2.2-2 3.7-5 3.7-2.1 0-4-0.8-5.1-2.3"
                fill="none" stroke="#000000" stroke-width="3.4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <!-- inner-ear notches so the ears stay legible against the head -->
        <ellipse cx="336" cy="318" rx="26" ry="23" fill="#000000"/>
        <ellipse cx="688" cy="318" rx="26" ry="23" fill="#000000"/>
        <!-- eyes -->
        <circle cx="437" cy="412" r="40" fill="#000000"/>
        <circle cx="587" cy="412" r="40" fill="#000000"/>
      </g>
    </mask>
  </defs>

  <g mask="url(#cuts)" fill="#000000">
    <g transform="translate(6.58,5.07) scale(0.0888)">
      <!-- ears (behind head) -->
      <ellipse cx="338" cy="313" rx="60" ry="55"/>
      <ellipse cx="686" cy="313" rx="60" ry="55"/>
      <!-- head -->
      <ellipse cx="512" cy="430" rx="205" ry="195"/>
      <!-- paws gripping the coin rim -->
      <circle cx="395" cy="505" r="42"/>
      <circle cx="629" cy="505" r="42"/>
      <!-- the coin -->
      <circle cx="512" cy="700" r="185"/>
      <!-- sparkles -->
      <path d="M800 213 L809 246 L842 255 L809 264 L800 297 L791 264 L758 255 L791 246 Z"/>
      <path d="M250 561 L255 580 L274 585 L255 590 L250 609 L245 590 L226 585 L245 580 Z"/>
    </g>
  </g>
</svg>
