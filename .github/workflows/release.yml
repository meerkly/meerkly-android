name: Release

# Tag-driven, draft first — mirrors unblocked-app's release flow.
#
#   scripts/release.sh 1.1        # bumps versionName/versionCode, commits, tags v1.1
#   git push --follow-tags
#
# That builds a signed universal APK and opens a DRAFT release. Download it,
# install it on a real phone, check it runs — then press Publish. That press is
# what makes it "latest".
#
# Requires four repo secrets (see scripts/release.sh --help for how to make
# them). Without them the build fails loudly rather than shipping an unsigned
# APK, which Android refuses to install.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.1)"
        required: true

permissions:
  contents: write

concurrency:
  # Never cancel a release mid-upload — a half-populated release is worse than
  # a slow one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.check.outputs.version }}
      versionName: ${{ steps.check.outputs.versionName }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Tag must match versionName
        id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          name=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ "$tag" != "v$name" ]; then
            echo "::error::Tag $tag does not match versionName $name in app/build.gradle.kts."
            echo "Use scripts/release.sh so the two stay in step."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "versionName=$name" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

  build:
    name: Build signed APKs
    needs: verify
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    env:
      # Lifted to the job env because `secrets` is not usable in a step-level
      # `if:` — this is what lets the Play upload skip cleanly when unset.
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Matches gradle/gradle-daemon-jvm.properties (toolchainVersion=21).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's hosted images ship the Android SDK; the self-hosted runner
      # image deliberately does not — it installs only sudo and a handful of
      # CLI tools, and baking a full SDK into it would inflate every job that
      # never touches Android. So the SDK is installed per run, here, which is
      # what release-sdks.yml's android-build already does.
      #
      # Without it the Gradle build fails looking for platform 36 with no
      # ANDROID_HOME, which reads as a broken build rather than a missing
      # toolchain.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets are present
        shell: bash
        env:
          KEYSTORE: ${{ secrets.MEERKLY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::MEERKLY_KEYSTORE_BASE64 is not set."
            echo "An unsigned APK cannot be installed, so there is no point building one."
            echo "Add the four signing secrets — see scripts/release.sh --help."
            exit 1
          fi

      - name: Tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE: ${{ secrets.MEERKLY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # Outside the repo tree so it can never be picked up by a build scan
          # or accidentally archived with the outputs.
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble release APKs
        env:
          MEERKLY_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          MEERKLY_KEYSTORE_PASSWORD: ${{ secrets.MEERKLY_KEYSTORE_PASSWORD }}
          MEERKLY_KEY_ALIAS: ${{ secrets.MEERKLY_KEY_ALIAS }}
          MEERKLY_KEY_PASSWORD: ${{ secrets.MEERKLY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Refuse to ship anything unsigned
        shell: bash
        run: |
          set -euo pipefail
          # An -unsigned.apk here means the signing config silently didn't
          # apply; publishing it would give people a file they can't install.
          if ls app/build/outputs/apk/release/*unsigned*.apk >/dev/null 2>&1; then
            echo "::error::Signing did not apply — found an unsigned APK."
            ls -l app/build/outputs/apk/release/
            exit 1
          fi

      - name: Name the APK for humans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Single universal APK (no more per-ABI splits — GeckoView is gone
          # and the app is ~24 MB, so one APK for every device is fine).
          #
          # Deliberately version-LESS. GitHub's
          # /releases/latest/download/<name> redirect resolves to the newest
          # release only if the filename is stable, and that URL is what the
          # download buttons on the sites point at — a versioned name would
          # 404 them on every release. The version lives in the release title
          # and tag.
          cp app/build/outputs/apk/release/app-release.apk dist/meerkly-universal.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: meerkly-apks
          retention-days: 3
          if-no-files-found: error
          path: dist/*.apk

      # The Play upload artifact. A bundle splits itself per-device at install
      # time and Play wants the modern uncompressed-and-aligned layout, so this
      # is built separately from the universal APK above rather than reusing it.
      - name: Bundle for Play
        env:
          MEERKLY_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          MEERKLY_KEYSTORE_PASSWORD: ${{ secrets.MEERKLY_KEYSTORE_PASSWORD }}
          MEERKLY_KEY_ALIAS: ${{ secrets.MEERKLY_KEY_ALIAS }}
          MEERKLY_KEY_PASSWORD: ${{ secrets.MEERKLY_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # A workflow artifact, not a release asset: an .aab is not installable, so
      # putting it on the public release page would just invite people to
      # download 240 MB they can't use.
      - uses: actions/upload-artifact@v4
        with:
          name: meerkly-aab
          retention-days: 14
          if-no-files-found: error
          path: app/build/outputs/bundle/release/*.aab

      # Ships the bundle to Play's internal track as a DRAFT — the same
      # verify-then-publish shape as the GitHub release above, so nothing
      # reaches testers (let alone production) without someone pressing a
      # button. Promote it in the Play Console.
      #
      # Skipped, loudly, when the service account isn't configured: the Play
      # API cannot create an app's *first* release, so that upload has to be
      # done by hand before this can ever work.
      # Open testing, published rather than drafted: the point of a release is
      # that testers can install it, and a draft sits in the Console until
      # someone remembers to press a button.
      #
      # `open` is public — anyone with the opt-in link can join. That is the
      # intent, but it does mean this is the first track where a bad build
      # reaches people who are not us. Play still gates it on review, and a
      # rollout can be halted from the Console, but neither undoes an install
      # someone already has.
      #
      # Expect the FIRST 2.0.0 upload to be held for a foreground-service
      # declaration review. The specialUse type is unchanged from 1.1.1, but its
      # subtype description now describes an exit node proxying traffic rather
      # than a crawl worker serving fetch jobs, and Play reads that string. That
      # is the documented catch-22 in CLAUDE.md: the form appears only after the
      # upload is blocked. It is the normal path, not a failure.
      - name: Publish to Play (open testing)
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: com.meerkly.android
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: open
          status: completed

      - name: Note when the Play upload was skipped
        if: env.PLAY_JSON == ''
        run: |
          echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set — bundle built but not uploaded to Play. Download the meerkly-aab artifact and upload it by hand."

  release:
    name: Draft release
    needs: [verify, build]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Collect APKs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what we're about to publish
        shell: bash
        run: ls -lh artifacts

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Idempotent: re-running the workflow for a tag refreshes its assets
          # rather than erroring on an existing release.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists — replacing its assets."
          else
            gh release create "$VERSION" \
              --draft \
              --title "Meerkly $VERSION" \
              --generate-notes
          fi
          gh release upload "$VERSION" artifacts/*.apk --clobber

      - name: Next step
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo "### Draft release $VERSION is ready :package:"
            echo ""
            echo "Grab **meerkly-universal.apk**, install it on a real device and"
            echo "check it runs — then **Publish release**."
            echo ""
            echo "https://github.com/${{ github.repository }}/releases"
          } >> "$GITHUB_STEP_SUMMARY"
