<?xml version="1.0" encoding="UTF-8"?>
<!--
  Google Play feature graphic source (1024x500, rendered to PNG).

  Cream & ink brand: wordmark + tagline on the left, the shared meerkat-and-coin
  mascot rising from the bottom edge on the right (coin deliberately bleeds
  ~28px below the canvas). Text is kept >60px from every edge — Play may crop
  or overlay the graphic in some placements. "Avenir Next" is a macOS system
  font; rasterize on macOS via scripts in this repo. Flatten to opaque.
-->
<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#eee1c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fffdf6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fffdf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcab68"/>
      <stop offset="1" stop-color="#bd8746"/>
    </linearGradient>
    <radialGradient id="coin" cx="35%" cy="28%" r="85%">
      <stop offset="0" stop-color="#ffe6a3"/>
      <stop offset="0.55" stop-color="#ffb43d"/>
      <stop offset="1" stop-color="#f59000"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- sun disc behind the mascot -->
  <circle cx="785" cy="255" r="215" fill="#f4ead8"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- mascot: source bbox x:226-842 y:213-889, scaled 0.75x; coin bottom lands
       at y=528 so it bleeds below the canvas edge -->
  <g transform="translate(379.5,-138.5) scale(0.75)">
    <!-- ears (behind head) -->
    <ellipse cx="338" cy="313" rx="60" ry="55" fill="url(#fur)"/>
    <ellipse cx="336" cy="318" rx="29" ry="26" fill="#ffb3d4"/>
    <ellipse cx="686" cy="313" rx="60" ry="55" fill="url(#fur)"/>
    <ellipse cx="688" cy="318" rx="29" ry="26" fill="#ffb3d4"/>

    <!-- head, peeking over the coin -->
    <ellipse cx="512" cy="430" rx="205" ry="195" fill="url(#fur)"/>

    <!-- dark eye patches -->
    <ellipse cx="434" cy="406" rx="62" ry="76" fill="#3a2417" transform="rotate(-18 434 406)"/>
    <ellipse cx="590" cy="406" rx="62" ry="76" fill="#3a2417" transform="rotate(18 590 406)"/>

    <!-- eyes -->
    <circle cx="437" cy="412" r="38" fill="#ffffff"/>
    <circle cx="441" cy="416" r="26" fill="#2a1a10"/>
    <circle cx="451" cy="403" r="11" fill="#ffffff"/>
    <circle cx="587" cy="412" r="38" fill="#ffffff"/>
    <circle cx="583" cy="416" r="26" fill="#2a1a10"/>
    <circle cx="601" cy="403" r="11" fill="#ffffff"/>

    <!-- paws gripping the coin rim -->
    <circle cx="395" cy="505" r="42" fill="#c08c4c"/>
    <circle cx="629" cy="505" r="42" fill="#c08c4c"/>

    <!-- the gold $ coin -->
    <circle cx="512" cy="700" r="185" fill="url(#coin)" stroke="#d97e00" stroke-width="8"/>
    <circle cx="512" cy="700" r="139" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10"/>
    <g transform="translate(512,700) scale(7.9) translate(-24,-24)">
      <path d="M24 12.5v23M28.8 17c-1.1-1.4-2.9-2.1-4.8-2.1-2.6 0-4.4 1.4-4.4 3.5 0 4.8 9.4 2.5 9.4 7.3 0 2.2-2 3.7-5 3.7-2.1 0-4-0.8-5.1-2.3"
            fill="none" stroke="#8a4a00" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- sparkles -->
    <path d="M800 213 L809 246 L842 255 L809 264 L800 297 L791 264 L758 255 L791 246 Z" fill="#ffd57f"/>
    <path d="M250 561 L255 580 L274 585 L255 590 L250 609 L245 590 L226 585 L245 580 Z" fill="#ffd57f"/>
  </g>

  <!-- wordmark + tagline (ink on cream), left column -->
  <text x="72" y="235" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif"
        font-weight="800" font-size="112" fill="#251b12">Meerkly</text>
  <text x="76" y="300" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif"
        font-weight="500" font-size="34" fill="#6e6253">Your phone helps out —</text>
  <text x="76" y="344" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif"
        font-weight="500" font-size="34" fill="#6e6253">and earns credits.</text>

  <!-- small gold sparkle accent over the wordmark -->
  <path d="M497 128 L504 152 L528 159 L504 166 L497 190 L490 166 L466 159 L490 152 Z" fill="#e0a017"/>
</svg>
